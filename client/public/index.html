<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Minimal Multiplayer Demo</title>
    <style>
      body { margin:0; font-family: Arial, Helvetica, sans-serif; }
      #game { background:#111; display:block; }
      #info { padding:8px; }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="info">Collect coins to earn points! Use arrow keys to move. Open multiple tabs to compete with others.</div>
    <div id="scores" style="padding: 8px; font-family: monospace; background: #222; color: #0f0;"></div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
